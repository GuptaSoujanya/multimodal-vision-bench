[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-vision-bench"
version = "0.2.0"
description = "Benchmarking framework for Vision-Language Models (VLMs) on OCR, chart understanding, and spatial reasoning."
readme = "README.md"
authors = [{ name = "Soujanya Gupta", email = "soujanya.gupta@ethara.ai" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.3.0", "mypy>=1.9.0"]

[project.scripts]
vlm-eval = "vision_bench.cli:main"
